services:
  db:
    image: postgres:16
    container_name: expense-explorer-db
    environment:
      - POSTGRES_DB=expense_explorer
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    container_name: expense-explorer-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - ConnectionStrings__expense-explorer=Host=db;Port=5432;Database=expense_explorer;Username=user;Password=password
      # "Today" for purchase date validation is taken from this time zone.
      - TZ=Europe/Warsaw
    volumes:
      - app_logs:/app/logs
      # Key that signs access tokens; created on first start and kept across updates.
      - app_keys:/app/keys
    restart: unless-stopped

volumes:
  postgres_data:
  app_logs:
  app_keys:

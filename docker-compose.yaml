services:
  db:
    image: postgres:16
    container_name: expense-explorer-db
    environment:
      - POSTGRES_DB=expense_explorer
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d expense_explorer"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    container_name: expense-explorer-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # The API migrates the database on start, so it waits until Postgres accepts connections.
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__expense-explorer=Host=db;Port=5432;Database=expense_explorer;Username=user;Password=password
      # "Today" for purchase date validation is taken from this time zone.
      - TZ=Europe/Warsaw
      # Reads the text of receipt photos; see the ocr folder.
      - Ocr__Url=http://ocr:8000/
    volumes:
      - app_logs:/app/logs
      # Key that signs access tokens; created on first start and kept across updates.
      - app_keys:/app/keys
    restart: unless-stopped

  # Text recognition for receipt photos. Only the API talks to it, so it has no published port.
  ocr:
    container_name: expense-explorer-ocr
    build:
      context: ocr
    restart: unless-stopped

volumes:
  postgres_data:
  app_logs:
  app_keys:

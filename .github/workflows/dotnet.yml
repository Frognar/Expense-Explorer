name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.x"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore
      run: dotnet restore ExpenseExplorer.slnx

    - name: Build
      run: dotnet build ExpenseExplorer.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test --solution ExpenseExplorer.slnx --configuration Release --no-build

  deploy-to-pi:
    # The Pi is updated only on demand: Actions > .NET > Run workflow on main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: self-hosted

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Back up the database
      shell: bash
      run: |
        backups="$HOME/expense-explorer-backups"
        mkdir -p "$backups"
        if docker ps --format '{{.Names}}' | grep -qx expense-explorer-db; then
          docker exec expense-explorer-db pg_dump -U user -d expense_explorer | gzip > "$backups/$(date +%Y%m%d-%H%M%S).sql.gz"
          # Keep the 20 newest backups.
          ls -1t "$backups"/*.sql.gz | tail -n +21 | xargs -r rm --
        fi

    # --remove-orphans stops containers of services no longer in the compose file
    # (the old "webapp" would otherwise keep port 8080).
    - name: Deploy with Docker Compose
      run: docker compose up -d --build --remove-orphans

